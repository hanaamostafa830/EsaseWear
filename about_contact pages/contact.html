<!-- Start Map -->
<div id="mapid" style="width: 100%; height: 300px;"></div>

<!-- Leaflet JS -->
<script
    src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin="">
</script>

<script>
    // Map coordinates
    var latitude = -23.013104;
    var longitude = -43.394365;

    // Create map
    var mymap = L.map('mapid').setView(
        [latitude, longitude],
        13
    );

    // Mapbox Public Access Token
    // IMPORTANT:
    // Do NOT put a Mapbox Secret Access Token here.
    // Use a PUBLIC token that starts with "pk."
    var mapboxToken = 'YOUR_MAPBOX_PUBLIC_TOKEN';

    // Add Mapbox tiles
    L.tileLayer(
        'https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token=' + mapboxToken,
        {
            maxZoom: 18,

            attribution:
                '<a href="https://www.mapbox.com/">Mapbox</a> ' +
                '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',

            id: 'mapbox/streets-v11',

            tileSize: 512,

            zoomOffset: -1
        }
    ).addTo(mymap);

    // Add marker
    L.marker([latitude, longitude])
        .addTo(mymap)
        .bindPopup(
            "<b>Our</b><br>ITI e-Commerce Project."
        )
        .openPopup();

    // Disable zoom with mouse wheel
    mymap.scrollWheelZoom.disable();

    // Disable touch zoom
    mymap.touchZoom.disable();
</script>
<!-- End Map -->


<!-- Start Contact -->
<div class="container py-5">

    <div class="row py-5">

        <form
            class="col-md-9 m-auto"
            id="myForm"
            method="post"
            role="form">

            <!-- Name & Email -->
            <div class="row">

                <div class="form-group col-md-6 mb-3">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control mt-1"
                        id="name"
                        name="name"
                        placeholder="Name"
                        required>

                </div>


                <div class="form-group col-md-6 mb-3">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control mt-1"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required>

                </div>

            </div>


            <!-- Subject -->
            <div class="mb-3">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    class="form-control mt-1"
                    id="subject"
                    name="subject"
                    placeholder="Subject"
                    required>

            </div>


            <!-- Message -->
            <div class="mb-3">

                <label for="message">
                    Message
                </label>

                <textarea
                    class="form-control mt-1"
                    id="message"
                    name="message"
                    placeholder="Message"
                    rows="8"
                    required>
                </textarea>

            </div>


            <!-- Submit -->
            <div class="row">

                <div class="col text-right mt-2">

                    <button
                        type="submit"
                        class="btn btn-success btn-lg px-3">
                        Submit
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>
<!-- End Contact -->
